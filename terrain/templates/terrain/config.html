{% extends "terrain/base.html" %}
{% block content %}
<form method="post" style="display:flex;flex-direction:column;gap:16px;flex:1;">
  {% csrf_token %}

  {% if affectations %}
    <div class="champ">
      <label for="affectation">Affectation</label>
      <select name="affectation" id="affectation" required>
        <option value="" disabled selected>Choisis une affectation</option>
        {% for affectation in affectations %}
          <option value="{{ affectation.id }}">{{ affectation.agent.nom }} — {{ affectation.materiel }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="flex:1;"></div>

    <button type="submit" class="bouton-principal">Commencer le scan</button>
  {% else %}
    <p style="color:#6B7280;font-size:14px;">
      Aucune affectation trouvée pour une mission active. Demande au responsable
      de créer ton affectation (agent + matériel) dans l'admin.
    </p>
  {% endif %}
</form>
{% endblock %}
