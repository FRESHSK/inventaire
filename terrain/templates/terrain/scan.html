{% extends "terrain/base.html" %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:space-between;">
  <div style="font-size:14px;color:#4B5563;">
    {{ zone.code_barres }} &middot; {{ agent.nom }}
  </div>
  <a href="{% url 'terrain:config' %}" class="bouton-secondaire" style="text-decoration:none;line-height:44px;padding:0 14px;display:inline-block;">Changer</a>
</div>

<div style="text-align:center;padding:12px 0;">
  <div style="font-size:40px;font-weight:600;">{{ scan_count }}</div>
  <div style="font-size:13px;color:#6B7280;">scans cette session</div>
</div>

<form method="post" id="scan-form" action="{% url 'terrain:scan' %}?zone={{ zone.id }}&agent={{ agent.id }}">
  {% csrf_token %}
  <input
    type="text"
    name="sku"
    id="sku"
    autocomplete="off"
    autofocus
    placeholder="En attente du scan"
    style="text-align:center;font-size:22px;height:76px;"
  >
</form>

<div style="flex:1;"></div>

<a href="{% url 'terrain:config' %}" class="bouton-secondaire" style="text-align:center;line-height:44px;text-decoration:none;display:block;">Terminer la session</a>

<script>
  var champ = document.getElementById("sku");
  function refocus() { champ.focus(); }
  refocus();
  setInterval(refocus, 1500);
  document.getElementById("scan-form").addEventListener("submit", function () {
    setTimeout(refocus, 100);
  });
</script>
{% endblock %}
